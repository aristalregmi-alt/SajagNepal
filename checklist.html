<!DOCTYPE html>
<html>

<head>

<title>Preparedness Center</title>

<link rel="stylesheet" href="checklist.css">

</head>

<body>

<div class="container">

<h1>✅ Preparedness Center</h1>

<p>
Track your emergency kit and preparedness actions.
</p>

<div class="progress-box">

<h2>Completion Status</h2>

<div class="progress">

<div id="progressFill"></div>

</div>

<p id="progressText">
0% Complete
</p>

</div>

<div class="checklist-card">

<h2>🎒 Emergency Kit Builder</h2>

<label><input type="checkbox" class="item"> Drinking Water</label>

<label><input type="checkbox" class="item"> First Aid Kit</label>

<label><input type="checkbox" class="item"> Medicines</label>

<label><input type="checkbox" class="item"> Flashlight</label>

<label><input type="checkbox" class="item"> Power Bank</label>

<label><input type="checkbox" class="item"> Emergency Radio</label>

<label><input type="checkbox" class="item"> Important Documents</label>

<label><input type="checkbox" class="item"> Dry Food Supplies</label>

</div>

<div class="checklist-card">

<h2>🏠 Preparedness Checklist</h2>

<label><input type="checkbox" class="item"> Family Meeting Point</label>

<label><input type="checkbox" class="item"> Emergency Contacts Saved</label>

<label><input type="checkbox" class="item"> Safety Drills Practiced</label>

<label><input type="checkbox" class="item"> Furniture Secured</label>

<label><input type="checkbox" class="item"> Evacuation Route Known</label>

<label><input type="checkbox" class="item"> Family Awareness Training</label>

</div>

</div>

<script src="checklist.js"></script>

</body>

</html>
